# Build the Nix package (flake.nix) from source and push it to the antho
# Cachix cache, so NixOS devices download prebuilt store paths instead of
# compiling (small ARM boards OOM on the webkit link otherwise).
#
# Runs on GitHub-hosted runners (x86_64 + aarch64, native each).
# Requires repo secret CACHIX_AUTH_TOKEN (write token for the cache).
#
# Also serves as a clean-room canary — if this passes, the app builds with
# nothing but declared dependencies.

name: Nix

on:
  workflow_dispatch:

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: nix build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pushes every store path built in this job to the cache when the job
      # ends (post step). Skips the push when the token is not configured
      # (e.g. on forks).
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: antho
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Flake check
        run: nix flake check --no-build

      - name: Build package
        run: nix build -L .#packages.${{ matrix.system }}.default

      - name: Inspect result
        run: |
          set -euo pipefail
          ls -la result/bin/
          test -x result/bin/rockchip-universal-imager
          test -e result/bin/rkdeveloptool
          test -d result/bin/loader_binaries
          test -f result/lib/udev/rules.d/70-rockchip-usb.rules
