<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rockchip Universal Imager</title>
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div style="max-width:720px; width:100%; padding:24px;">
        <div id="errorStatus" style="color:#e05b5b; margin-top:4px; min-height:20px; word-break:break-word;"></div>

        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;">
            <button id="installDriver">Install device access</button>
            <div id="driverStatus" style="color:#bbb; min-height:20px;"></div>
        </div>

        <h2 style="font-size:15px; color:#bbb; margin:20px 0 8px 0;">Devices</h2>
        <div id="deviceList"></div>
        <div id="noDevices" style="color:#888;">No Rockchip devices detected. Put a board into maskrom/loader mode and connect it over USB.</div>

        <!-- Shared image: one selection flashed to whichever devices you choose.
             Show Log sits at the right end of the same row. -->
        <div style="display:flex; gap:8px; margin-top:20px; align-items:center; flex-wrap:wrap;">
            <button id="selectImage">Select .img</button>
            <div id="selectedImage" style="color:#888; word-break:break-all; min-width:0;">No image selected</div>
            <button id="toggleLog" style="margin-left:auto; background:none; border:none; color:#777; font-size:12px; padding:2px 4px; cursor:pointer; text-decoration:underline; white-space:nowrap;">Show Log</button>
        </div>

        <div id="logPanel" style="display:none; margin-top:16px;">
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <button id="copyLog">Copy Log</button>
                <button id="clearLog">Clear Log</button>
                <button id="openLogDir">Open Log Folder</button>
            </div>
            <textarea id="liveLog" readonly style="width:100%; height:160px; background:#0b0b0b; color:#9bd; border:1px solid #333; padding:8px;"></textarea>
        </div>
    </div>

    <div id="confirmModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:#222; border:1px solid #555; border-radius:8px; padding:20px; max-width:420px;">
            <div id="confirmMessage" style="margin-bottom:16px; white-space:pre-wrap; color:#eee;"></div>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button id="confirmCancelBtn">Go Back</button>
                <button id="confirmOkBtn" style="background:#a33; color:white;">Confirm</button>
            </div>
        </div>
    </div>

    <div id="alertModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:#222; border:1px solid #555; border-radius:8px; padding:20px; max-width:420px;">
            <div id="alertMessage" style="margin-bottom:16px; white-space:pre-wrap; color:#eee;"></div>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button id="alertOkBtn">OK</button>
            </div>
        </div>
    </div>

    <div id="dropOverlay" aria-hidden="true">
        <div id="dropOverlayText">Drop .img to select</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
